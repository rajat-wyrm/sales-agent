name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test-api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: |
          cd packages/api
          npm install --no-audit --no-fund
      - name: Run lint
        run: cd packages/api && npm run lint
      - name: Run tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-secret
          ENCRYPTION_SECRET: test-encryption-secret-0123456789abcdef
        run: cd packages/api && npx jest --config test/jest.config.cjs

  test-scrapers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          cd packages/scrapers
          python -m venv venv
          source venv/bin/activate
          pip install -r requirements.txt
          pip install pytest pytest-asyncio
      - name: Run tests
        run: |
          cd packages/scrapers
          PYTHONPATH=. source venv/bin/activate && python -m pytest tests/ -v

  test-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: packages/web/package-lock.json
      - name: Install dependencies
        run: |
          cd packages/web
          npm ci
      - name: Type check
        run: cd packages/web && npx tsc --noEmit
      - name: Unit tests
        env:
          CI: true
        run: cd packages/web && npm test

  build-and-push:
    needs: [test-api, test-scrapers, test-web]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=raw,enable=true
      - name: Build and push API
        uses: docker/build-push-action@v5
        with:
          context: ./packages/api
          file: ./packages/api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
      - name: Build and push Scrapers
        uses: docker/build-push-action@v5
        with:
          context: ./packages/scrapers
          file: ./packages/scrapers/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
      - name: Build and push Web
        uses: docker/build-push-action@v5
        with:
          context: ./packages/web
          file: ./packages/web/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
